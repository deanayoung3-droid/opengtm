<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 398" width="1200" height="398" role="img"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1 9 5 1 9" fill="none" stroke="#9ca3af" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect x=".5" y=".5" width="1199" height="397" rx="14" fill="#ffffff" stroke="#e5e7eb"/><g transform="translate(0 -72)"><rect x="40.5" y="120.5" width="259" height="79" rx="12" fill="#fafafa" stroke="#e5e7eb" stroke-width="1"/><text x="60" y="154" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#0a0a0a" text-anchor="start">Facts about them</text><text x="60" y="176" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#6b7280" text-anchor="start">Each one with the page it came from</text><path d="M300 160C 330 160 330 260 356 260" fill="none" stroke="#9ca3af" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><rect x="40.5" y="220.5" width="259" height="79" rx="12" fill="#fafafa" stroke="#e5e7eb" stroke-width="1"/><text x="60" y="254" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#0a0a0a" text-anchor="start">Your proof points</text><text x="60" y="276" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#6b7280" text-anchor="start">The only claims it may make about you</text><path d="M300 260C 330 260 330 260 356 260" fill="none" stroke="#9ca3af" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><rect x="40.5" y="320.5" width="259" height="79" rx="12" fill="#fafafa" stroke="#e5e7eb" stroke-width="1"/><text x="60" y="354" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#0a0a0a" text-anchor="start">Your instructions</text><text x="60" y="376" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#6b7280" text-anchor="start">Tone, offer, words to never use</text><path d="M300 360C 330 360 330 260 356 260" fill="none" stroke="#9ca3af" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><rect x="360.5" y="220.5" width="149" height="79" rx="12" fill="#4f5bf6" stroke="#4f5bf6" stroke-width="1"/><g transform="translate(386 260) scale(1)" fill="none" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M-7 7l1.5-5L4-7.5 7.5-4-2 5.5z"/></g><text x="404" y="255" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#ffffff" text-anchor="start">AI writer</text><text x="404" y="275" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#e0e3ff" text-anchor="start">two emails</text><path d="M510 260H546" fill="none" stroke="#9ca3af" stroke-width="1.2" marker-end="url(#arrow)" stroke-linecap="round" stroke-linejoin="round"/><rect x="552.5" y="120.5" width="339" height="299" rx="12" fill="#fafafa" stroke="#e5e7eb" stroke-width="1"/><text x="576" y="152" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#0a0a0a" text-anchor="start">Checked before sending</text><path d="M578 182l3 3 6-6.5" fill="none" stroke="#16a34a" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="598" y="186" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#0a0a0a" text-anchor="start">Every claim traces to a fact or proof point</text><path d="M578 211l3 3 6-6.5" fill="none" stroke="#16a34a" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="598" y="215" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#0a0a0a" text-anchor="start">No numbers it can't cite</text><path d="M578 240l3 3 6-6.5" fill="none" stroke="#16a34a" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="598" y="244" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#0a0a0a" text-anchor="start">No banned or spammy phrases</text><path d="M578 269l3 3 6-6.5" fill="none" stroke="#16a34a" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="598" y="273" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#0a0a0a" text-anchor="start">No fake “Re:”, familiarity or urgency</text><path d="M578 298l3 3 6-6.5" fill="none" stroke="#16a34a" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="598" y="302" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#0a0a0a" text-anchor="start">No links in the first two emails</text><path d="M578 327l3 3 6-6.5" fill="none" stroke="#16a34a" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="598" y="331" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#0a0a0a" text-anchor="start">One question, 50 to 100 words</text><path d="M578 356l3 3 6-6.5" fill="none" stroke="#16a34a" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="598" y="360" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#0a0a0a" text-anchor="start">Plain text, with your address and an opt-out</text><path d="M578 385l3 3 6-6.5" fill="none" stroke="#16a34a" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="598" y="389" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#0a0a0a" text-anchor="start">An AI reviewer flags anything misleading</text><path d="M892 270C 916 270 916 180 936 180" fill="none" stroke="#9ca3af" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><rect x="940.5" y="150.5" width="219" height="63" rx="12" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/><circle cx="962" cy="174" r="4" fill="#16a34a"/><text x="974" y="178" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#0a0a0a" text-anchor="start">Passes</text><text x="974" y="198" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#6b7280" text-anchor="start">Sends on schedule</text><path d="M892 270C 916 270 916 272 936 272" fill="none" stroke="#9ca3af" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><rect x="940.5" y="242.5" width="219" height="63" rx="12" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/><circle cx="962" cy="266" r="4" fill="#d97706"/><text x="974" y="270" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#0a0a0a" text-anchor="start">Flagged</text><text x="974" y="290" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#6b7280" text-anchor="start">Rewritten, then re-checked</text><path d="M892 270C 916 270 916 364 936 364" fill="none" stroke="#9ca3af" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><rect x="940.5" y="334.5" width="219" height="63" rx="12" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/><circle cx="962" cy="358" r="4" fill="#dc2626"/><text x="974" y="362" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#0a0a0a" text-anchor="start">Still flagged</text><text x="974" y="382" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#6b7280" text-anchor="start">Waits for a person</text><text x="940" y="440" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#9ca3af" text-anchor="start">You approve the first 50 by default.</text></g></svg>
