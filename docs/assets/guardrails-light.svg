<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 278" width="1200" height="278" role="img"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1 9 5 1 9" fill="none" stroke="#9ca3af" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect x=".5" y=".5" width="1199" height="277" rx="14" fill="#ffffff" stroke="#e5e7eb"/><g transform="translate(0 -72)"><rect x="40.5" y="112.5" width="1119" height="199" rx="12" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/><path d="M41 212H1159" fill="none" stroke="#e5e7eb" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><path d="M413.3333333333333 113V311" fill="none" stroke="#e5e7eb" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><path d="M786.6666666666666 113V311" fill="none" stroke="#e5e7eb" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text x="68.0" y="158" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="28" font-weight="600" fill="#0a0a0a" text-anchor="start" letter-spacing="-0.8">2%</text><text x="68.0" y="184" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5"><tspan fill="#0a0a0a" font-weight="600">Hard bounces</tspan><tspan fill="#6b7280"> pause that mailbox</tspan></text><text x="441.3333333333333" y="158" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="28" font-weight="600" fill="#0a0a0a" text-anchor="start" letter-spacing="-0.8">0.1%</text><text x="441.3333333333333" y="184" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5"><tspan fill="#0a0a0a" font-weight="600">Spam complaints</tspan><tspan fill="#6b7280"> pause that domain</tspan></text><text x="814.6666666666666" y="158" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="28" font-weight="600" fill="#0a0a0a" text-anchor="start" letter-spacing="-0.8">85%</text><text x="814.6666666666666" y="184" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5"><tspan fill="#0a0a0a" font-weight="600">Inbox placement</tspan><tspan fill="#6b7280"> or the mailbox is retired</tspan></text><text x="68.0" y="258" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="28" font-weight="600" fill="#0a0a0a" text-anchor="start" letter-spacing="-0.8">1 click</text><text x="68.0" y="284" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5"><tspan fill="#0a0a0a" font-weight="600">Kill switch</tspan><tspan fill="#6b7280"> stops all sending</tspan></text><text x="441.3333333333333" y="258" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="28" font-weight="600" fill="#0a0a0a" text-anchor="start" letter-spacing="-0.8">Daily</text><text x="441.3333333333333" y="284" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5"><tspan fill="#0a0a0a" font-weight="600">Send and spend caps</tspan><tspan fill="#6b7280"> never exceeded</tspan></text><text x="814.6666666666666" y="258" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="28" font-weight="600" fill="#0a0a0a" text-anchor="start" letter-spacing="-0.8">Forever</text><text x="814.6666666666666" y="284" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5"><tspan fill="#0a0a0a" font-weight="600">Suppression</tspan><tspan fill="#6b7280"> opt-outs stay opted out</tspan></text></g></svg>
